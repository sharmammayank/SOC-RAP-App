<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>SOC-RAP Reporting</title>
<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#F7F9FB; --line:#DCE2EA; --line-strong:#C3CCD8;
  --ink:#0E1726; --ink-2:#435066; --muted:#6B7686;
  --accent:#0057B8; --accent-ink:#FFFFFF; --accent-soft:#E4EEFA; --navy:#002855;
  --good-ink:#0B6B0B; --good-bg:#E5F3E5; --bad-ink:#B42C2C; --bad-bg:#FBE8E8; --warn-ink:#865700; --warn-bg:#FDF2D8;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --prev:#B7C0CC;
  --grid:#E6EAF0; --axis:#C3CCD8;
  --heat-lo:#EAF2FC; --heat-hi:#0D4A96; --heat-flip:#FFFFFF;
  --shadow:0 1px 2px rgba(14,23,38,.06),0 4px 16px rgba(14,23,38,.05);
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-head:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B111B; --surface:#121A27; --surface-2:#172131; --line:#253149; --line-strong:#34425E;
    --ink:#E7ECF3; --ink-2:#B4BFCE; --muted:#8C97A8;
    --accent:#4D9BEA; --accent-ink:#06121F; --accent-soft:#15304F; --navy:#A9CBF0;
    --good-ink:#5ED35E; --good-bg:#10301A; --bad-ink:#F28282; --bad-bg:#3B1719; --warn-ink:#F3C150; --warn-bg:#3A2E10;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --prev:#3F4B60;
    --grid:#1F2A3D; --axis:#34425E;
    --heat-lo:#172234; --heat-hi:#8CBDF3; --heat-flip:#06121F;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B111B; --surface:#121A27; --surface-2:#172131; --line:#253149; --line-strong:#34425E;
  --ink:#E7ECF3; --ink-2:#B4BFCE; --muted:#8C97A8;
  --accent:#4D9BEA; --accent-ink:#06121F; --accent-soft:#15304F; --navy:#A9CBF0;
  --good-ink:#5ED35E; --good-bg:#10301A; --bad-ink:#F28282; --bad-bg:#3B1719; --warn-ink:#F3C150; --warn-bg:#3A2E10;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --prev:#3F4B60;
  --grid:#1F2A3D; --axis:#34425E;
  --heat-lo:#172234; --heat-hi:#8CBDF3; --heat-flip:#06121F;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;margin:0;letter-spacing:.005em}
h2{font-size:20px;font-weight:600}
h3{font-size:15px;font-weight:600}
.mono{font-family:var(--f-mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* App frame */
.topbar{background:var(--navy);color:#fff;padding-inline:16px;padding-block:10px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
:root[data-theme="dark"] .topbar{background:#0A1830;color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .topbar{background:#0A1830;color:var(--ink)}}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--f-head);font-size:20px;font-weight:700;letter-spacing:.02em}
.brand span{font-size:12.5px;opacity:.75}
.demo-flag{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:#FFB500;color:#1B1300;border-radius:3px;padding:2px 7px}
.topbar .spacer{flex:1}
.src-chip{font-size:12.5px}
.client-box{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.client-box select,.client-box input{background:#fff;color:#0E1726;border:1px solid rgba(255,255,255,.5);border-radius:6px;padding:4px 8px;font-size:13px;max-width:260px}
.client-box .btn{background:transparent;color:inherit;border-color:rgba(255,255,255,.55)}
.client-box .btn.primary{background:#FFB500;border-color:#FFB500;color:#1B1300}

.controls{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-inline:16px;padding-block:10px;display:flex;gap:12px 18px;align-items:center;flex-wrap:wrap}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 11px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.seg button:focus-visible,.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=date],input[type=month],input[type=number],input[type=text],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:5px 8px;min-width:0}
textarea{width:100%;resize:vertical}
.cmp-label{font-size:12.5px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:500;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{padding:3px 9px;font-size:12.5px}
.ctl-right{margin-left:auto}

.layout{display:grid;grid-template-columns:190px minmax(0,1fr);gap:0;min-height:calc(100vh - 110px)}
nav.tabs{border-right:1px solid var(--line);background:var(--surface);padding-block:14px;padding-inline:10px;display:flex;flex-direction:column;gap:2px}
.tab{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--ink-2);font-weight:500}
.tab:hover{background:var(--surface-2)}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge{font-size:11px;font-weight:700;border-radius:10px;padding:1px 7px;background:var(--bad-bg);color:var(--bad-ink)}
.badge.soft{background:var(--warn-bg);color:var(--warn-ink)}
main{padding-inline:22px;padding-block:20px 60px;display:flex;flex-direction:column;gap:18px;min-width:0}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  nav.tabs{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding-block:6px}
  .tab{flex:0 0 auto}
  main{padding-inline:16px}
  .ctl-right{margin-left:0}
}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.page-head h2{font-size:24px}
.page-head p{margin:2px 0 0;color:var(--muted)}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--f-head);font-size:28px;font-weight:600;line-height:1.15}
.kpi .d{font-size:12px;color:var(--muted)}

/* Callouts & chips */
.callout{border-radius:8px;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid}
.callout.bad{background:var(--bad-bg);border-color:transparent;color:var(--bad-ink)}
.callout.ok{background:var(--good-bg);border-color:transparent;color:var(--good-ink)}
.callout.info{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.callout b{font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;border-radius:4px;padding:1px 6px;white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good-ink)}
.chip.bad{background:var(--bad-bg);color:var(--bad-ink)}
.chip.warn{background:var(--warn-bg);color:var(--warn-ink)}
.chip.neutral{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.delta-up{color:var(--good-ink)} .delta-down{color:var(--bad-ink)} .delta-flat{color:var(--muted)}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;font-weight:600;color:var(--muted);background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.sla td{vertical-align:middle}
.sla .cell{display:flex;flex-direction:column;gap:3px;min-width:118px}
.sla .pct{font-family:var(--f-head);font-size:19px;font-weight:600;line-height:1.1}
.sla .meta{font-size:11.5px;color:var(--muted)}
.prio{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.cases td{font-size:12.5px}
.cases td.title{max-width:340px;overflow-wrap:anywhere}

/* Charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .lbl{fill:var(--ink-2);font-size:11px;font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;border-radius:6px;padding:6px 9px;max-width:300px;box-shadow:var(--shadow)}
#tip div+div{opacity:.85}

/* Heatmap */
.heat{border-collapse:separate;border-spacing:2px;width:auto}
.heat th,.heat td{border:0;padding:0}
.heat th{background:transparent;font-weight:500;font-size:11px;color:var(--muted);text-align:center}
.heat th.rowh{text-align:right;padding-right:8px;max-width:330px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;color:var(--ink-2)}
.heat td.c{width:30px;height:24px;border-radius:3px;text-align:center;font-size:10.5px;font-weight:500;cursor:default}
.heat td.tot{padding-left:8px;font-size:12px;font-weight:600;color:var(--ink-2);text-align:right}
.heat td.pc{width:70px;height:24px;border-radius:3px;text-align:center;font-size:11.5px;font-weight:500}

/* Review */
.rv{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.rv summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:11px 14px}
.rv summary::-webkit-details-marker{display:none}
.rv summary .t{font-weight:600}
.rv .body{padding:4px 14px 14px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
.rv.done{opacity:.72}
.formrow{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap}
.formrow label{font-size:12.5px;color:var(--muted)}
.sev{width:8px;align-self:stretch;border-radius:4px}

/* Settings */
.slagrid td{white-space:nowrap}
.slagrid input[type=number]{width:74px}
.slagrid .sec{font-size:11px;color:var(--muted);display:block;margin-top:2px}
.rules td{font-size:12.5px}
.rules td.pat{font-family:var(--f-mono);font-size:11.5px;max-width:520px;overflow-wrap:anywhere;color:var(--ink-2)}
.tester{display:flex;flex-direction:column;gap:8px}
.tester-out{font-size:13px;padding:8px 12px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line)}

/* Data */
.drop{border:2px dashed var(--line-strong);border-radius:10px;padding:26px 16px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;background:var(--surface-2)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.map td{font-size:12.5px}
.preview{font-family:var(--f-mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:10px 12px;overflow-x:auto;white-space:pre}
ul.obs{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:60;box-shadow:var(--shadow);max-width:min(92vw,560px)}
@media (prefers-reduced-motion:no-preference){.toast{animation:rise .18s ease-out}@keyframes rise{from{transform:translate(-50%,6px);opacity:0}}}
</style>
</head>
<body>


<div class="topbar">
  <div class="brand"><b>SOC-RAP</b><span>SLA &amp; service review reporting</span></div>
  <span class="demo-flag" id="demoFlag">Demo · sample data</span>
  <div class="spacer"></div>
  <div class="src-chip" id="srcChip"></div>
</div>

<div class="controls" role="toolbar" aria-label="Report period">
  <div class="ctl">
    <span class="eyebrow">Period</span>
    <div class="seg" id="cadenceSeg">
      <button type="button" data-v="daily" aria-pressed="false">Daily</button>
      <button type="button" data-v="weekly" aria-pressed="false">Weekly</button>
      <button type="button" data-v="monthly" aria-pressed="true">Monthly</button>
      <button type="button" data-v="custom" aria-pressed="false">Custom</button>
    </div>
    <span id="periodInputs" class="ctl"></span>
    <span class="cmp-label" id="cmpLabel"></span>
  </div>
  <div class="ctl">
    <span class="eyebrow">Time zone</span>
    <div class="seg" id="tzSeg">
      <button type="button" data-v="330" aria-pressed="true">IST</button>
      <button type="button" data-v="0" aria-pressed="false">UTC</button>
    </div>
  </div>
  <div class="ctl ctl-right">
    <button type="button" class="btn" id="btnXlsx">Download Excel</button>
    <button type="button" class="btn primary" id="btnPptx">Download PowerPoint</button>
  </div>
</div>

<div class="layout">
  <nav class="tabs" role="tablist" aria-label="Sections" id="tabs"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<div id="tip" hidden></div>
